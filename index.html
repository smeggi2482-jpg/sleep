<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 수면 케어 & 데일리 스케줄러</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0b0f19; color: #e2e8f0; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glow-effect { box-shadow: 0 0 25px -5px rgba(99, 102, 241, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-8">

    <header class="max-w-4xl mx-auto w-full mb-8">
        <h1 class="text-2xl font-bold text-white mb-2">AI 수면 & 일과 관리</h1>
        <p class="text-slate-400 text-sm">복습과 운동 시간을 포함한 최적의 루틴을 생성하세요.</p>
    </header>

    <main class="max-w-4xl mx-auto w-full grid grid-cols-1 md:grid-cols-2 gap-8">
        <section class="glass-card p-6 rounded-2xl">
            <form id="schedulerForm" onsubmit="generateSchedule(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">기상 희망 시간</label>
                    <input type="time" id="wakeTime" value="07:00" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">목표 수면 시간</label>
                    <input type="range" id="sleepHours" min="5" max="10" step="0.5" value="8" class="w-full accent-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">주요 할 일 (학습/업무)</label>
                    <textarea id="dailyTasks" rows="3" placeholder="예: 수학 문제 풀기, 프로젝트 보고서 작성" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-sm font-bold transition">스케줄 생성 시작</button>
            </form>
        </section>

        <section id="timelineList" class="space-y-3">
            <!-- AI 스케줄 표시 영역 -->
        </section>
    </main>

    <script>
        async function generateSchedule(event) {
            event.preventDefault();
            const container = document.getElementById('timelineList');
            container.innerHTML = '<p class="text-center text-slate-500 py-10">AI가 복습과 운동을 포함한 일과표를 작성 중입니다...</p>';

            const body = {
                wakeTime: document.getElementById('wakeTime').value,
                sleepHours: document.getElementById('sleepHours').value,
                dailyTasks: document.getElementById('dailyTasks').value
            };

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const { data } = await res.json();
                renderTimeline(data);
            } catch (e) {
                alert("서버 연결 실패. 배포 환경을 확인해주세요.");
            }
        }

        function renderTimeline(data) {
            const container = document.getElementById('timelineList');
            container.innerHTML = '';
            data.schedule.forEach(item => {
                let icon = 'fa-calendar';
                if(item.category === '운동') icon = 'fa-dumbbell text-emerald-400';
                if(item.category === '복습') icon = 'fa-brain text-purple-400';
                
                container.innerHTML += `
                    <div class="glass-card p-4 rounded-xl flex gap-4 border-l-4 border-indigo-500">
                        <i class="fa-solid ${icon} text-lg"></i>
                        <div>
                            <p class="font-bold text-sm">${item.title}</p>
                            <p class="text-xs text-slate-400">${item.time} | ${item.description}</p>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
